<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agrogestor - Financial</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Agrogestor</h1>
    <nav>
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('animais') }}">Animals</a>
      <a href="{{ url_for('custos') }}" class="active">Costs and Revenue</a>
      <a href="{{ url_for('relatorios') }}">Reports</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Financial Entry</h2>
      <form action="/custos" method="POST">
        <select name="type" required>
          <option value="Despesa">Expense (Cost)</option>
          <option value="Receita">Revenue (Sale/Milk)</option>
        </select>
        <input type="text" name="target" placeholder="Ear Tag or Batch" required>
        <input type="text" name="description" placeholder="Description (e.g., Feed, Vaccine, Sale)" required>
        <input type="number" name="amount" placeholder="Amount ($)" step="0.01" required>
        <button type="submit">Register Entry</button>
      </form>
    </section>

    <section class="card">
      <h2>Transaction History</h2>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Target</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</body>
</html>
