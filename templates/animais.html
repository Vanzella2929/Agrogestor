<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agrogestor - Animais</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Agrogestor</h1>
    <nav>
      <a href="index.html">Painel</a>
      <a href="animais.html" class="active">Animais</a>
      <a href="custos.html">Custos e Receitas</a>
      <a href="relatorios.html">Relatórios</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Cadastrar Animal</h2>
      <form id="animal-form">
        <input type="text" id="tag" placeholder="Brinco / Identificação" required>
        <select id="category" required>
          <option value="">Selecione a Categoria</option>
          <option value="Vaca Parida">Vaca Parida</option>
          <option value="Bezerro(a)">Bezerro(a)</option>
          <option value="Touro">Touro</option>
        </select>
        <input type="date" id="birth-date" required>
        <input type="text" id="lot" placeholder="Lote / Pasto" required>
        <button type="submit">Salvar Animal</button>
      </form>
    </section>

    <section class="card">
      <h2>Rebanho Cadastrado</h2>
      <table>
        <thead>
          <tr>
            <th>Brinco</th>
            <th>Categoria</th>
            <th>Data de Nasc.</th>
            <th>Lote</th>
          </tr>
        </thead>
        <tbody id="animal-list"></tbody>
      </table>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
