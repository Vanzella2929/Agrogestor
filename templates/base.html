<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoviCria Pro - Gestão Pecuária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 sidebar p-0">
                <div class="brand-title"> AgroGestor</div>
                <div class="p-3">
                    <a href="{{ url_for('index') }}"> Dashboard</a>
                    <a href="{{ url_for('listar_animais') }}"> Animais</a>
                    <a href="{{ url_for('listar_bezerros') }}"> Bezerros</a>
                    <a href="{{ url_for('listar_custos') }}"> Custos</a>
                    <a href="{{ url_for('relatorios') }}"> Relatórios</a>
                </div>
            </nav>

            <!-- Conteúdo Principal -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
