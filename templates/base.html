<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Agrogestor{% endblock %}</title>

    <meta name="description" content="Agrogestor - Gestão inteligente da propriedade rural">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="topbar">

        <div class="topbar-container">

            <!-- LOGO -->
            <a href="{{ url_for('index') }}" class="logo-area">

                <div class="logo-icon">
                    <span>AG</span>
                </div>

                <div class="logo-text">
                    <strong>Agrogestor</strong>
                    <small>Gestão da propriedade rural</small>
                </div>

            </a>

            <!-- MENU -->
            <nav class="menu">

                <a href="{{ url_for('index') }}"
                   class="{% if request.endpoint == 'index' %}ativo{% endif %}">
                    <span class="menu-icon">⌂</span>
                    Painel
                </a>

                <a href="{{ url_for('animais') }}"
                   class="{% if request.endpoint == 'animais' %}ativo{% endif %}">
                    <span class="menu-icon">▰</span>
                    Rebanho
                </a>

                <a href="{{ url_for('custos') }}"
                   class="{% if request.endpoint == 'custos' %}ativo{% endif %}">
                    <span class="menu-icon">$</span>
                    Financeiro
                </a>

                <a href="{{ url_for('relatorios') }}"
                   class="{% if request.endpoint == 'relatorios' %}ativo{% endif %}">
                    <span class="menu-icon">▥</span>
                    Relatórios
                </a>

                <a href="{{ url_for('agenda') }}"
                   class="{% if request.endpoint == 'agenda' %}ativo{% endif %}">
                    <span class="menu-icon">▣</span>
                    Agenda
                </a>

            </nav>

            <!-- PERFIL -->
            <div class="perfil">

                <div class="perfil-icon">
                    ●
                </div>

                <span class="perfil-seta">⌄</span>

            </div>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        {% block conteudo %}
        {% endblock %}

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <div>
            Agrogestor
        </div>

        <span>
            Gestão inteligente da propriedade rural
        </span>

    </footer>

</body>
</html>
