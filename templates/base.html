<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block titulo %}
            Agrogestor
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- ==========================================================
     CABEÇALHO
     ========================================================== -->

<header class="topo">

    <div class="topo-conteudo">


        <!-- LOGO -->

        <a
            href="{{ url_for('index') }}"
            class="logo"
        >

            <div class="logo-icone">
                🌱
            </div>

            <div class="logo-texto">

                <strong>
                    Agrogestor
                </strong>

                <small>
                    Gestão da propriedade rural
                </small>

            </div>

        </a>


        <!-- MENU -->

        <nav class="menu">

            <a
                href="{{ url_for('index') }}"
            >
                🏠
                <span>Painel</span>
            </a>


            <a
                href="{{ url_for('animais') }}"
            >
                🐄
                <span>Rebanho</span>
            </a>


            <a
                href="{{ url_for('custos') }}"
            >
                💰
                <span>Financeiro</span>
            </a>


            <a
                href="{{ url_for('relatorios') }}"
            >
                📊
                <span>Relatórios</span>
            </a>


            <a
                href="{{ url_for('agenda') }}"
            >
                📅
                <span>Agenda</span>
            </a>

        </nav>

    </div>

</header>


<!-- ==========================================================
     CONTEÚDO PRINCIPAL
     ========================================================== -->

<main class="container">

    {% block conteudo %}

    {% endblock %}

</main>


<!-- ==========================================================
     RODAPÉ
     ========================================================== -->

<footer class="rodape">

    <div>

        <strong>
            🌱 Agrogestor
        </strong>

        <p>
            Gestão simples para o produtor rural.
        </p>

    </div>


    <div>

        <small>
            Sistema de controle de rebanho e produção
        </small>

    </div>

</footer>


</body>

</html>
