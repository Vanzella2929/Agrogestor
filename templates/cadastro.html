<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Agrogestor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef5ef;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cadastro-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #237a3b;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #237a3b;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b6030;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #237a3b;
            font-weight: bold;
            text-decoration: none;
        }

        .mensagem {
            background: #ffdede;
            color: #a00000;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="cadastro-box">

        <h1>Agrogestor</h1>

        <p class="subtitulo">
            Crie sua conta
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for categoria, mensagem in messages %}

                    <div class="mensagem">
                        {{ mensagem }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@gmail.com"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >


            <label for="confirmar_senha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                placeholder="Digite a senha novamente"
                required
            >


            <button type="submit">
                Criar minha conta
            </button>

        </form>


        <div class="login">

            Já tem uma conta?

            <a href="{{ url_for('login') }}">
                Fazer login
            </a>

        </div>

    </div>

</body>
</html>
