{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">👶 Cadastrar Novo Bezerro</div>
            <div class="card-body">
                <form action="{{ url_for('cadastrar_bezerro') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Selecione a Mãe (Matriz) *</label>
                        <select name="mae_id" class="form-select" required>
                            <option value="">-- Escolha a Matriz --</option>
                            {% for mae in maes %}
                            <option value="{{ mae.id }}">Brinco {{ mae.brinco }} - {{ mae.nome or 'Sem nome' }} ({{ mae.raca }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Número do Brinco da Cria *</label>
                        <input type="text" name="brinco" class="form-control" placeholder="Ex: B101" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Sexo *</label>
                            <select name="sexo" class="form-select" required>
                                <option value="Macho">Macho</option>
                                <option value="Fêmea">Fêmea</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Peso ao Nascer (kg)</label>
                            <input type="number" step="0.1" name="peso_nascimento" class="form-control" placeholder="Ex: 31.5">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Data de Nascimento *</label>
                        <input type="date" name="data_nascimento" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Situação *</label>
                        <select name="situacao" class="form-select" required>
                            <option value="Mamando">Mamando</option>
                            <option value="Desmamado">Desmamado</option>
                            <option value="Vendido">Vendido</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('listar_bezerros') }}" class="btn btn-secondary">Voltar</a>
                        <button type="submit" class="btn btn-agro">Salvar Bezerro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
